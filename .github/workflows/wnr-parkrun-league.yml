name: wnr-parkrun-league

on:
  schedule:
    # 09:00 UTC every Saturday (GitHub cron is UTC; this is 09:00 UK time in GMT, 10:00 in BST)
    - cron: "0 9 * * 6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-league:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::tidyverse
            any::hms
            any::googlesheets4
            sgbstats/parkrunfunctions

      - name: Write Google credentials
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$GOOGLE_CREDENTIALS" || -z "$GOOGLE_PRIVATE_KEY" ]]; then
            echo "::error::Set both GOOGLE_CREDENTIALS and GOOGLE_PRIVATE_KEY repository secrets."
            exit 1
          fi
          jq --arg key "$GOOGLE_PRIVATE_KEY" \
            '.private_key = ($key | gsub("\\\\n"; "\n") | gsub("\r\n?"; "\n"))' \
            <<< "$GOOGLE_CREDENTIALS" > credentials.json
          chmod 600 credentials.json

      - name: Check credentials file
        run: |
          set -euo pipefail
          if ! jq -e '
            .type == "service_account" and
            (.client_email | type == "string" and length > 0) and
            (.token_uri | type == "string" and length > 0) and
            (.private_key | type == "string" and
              startswith("-----BEGIN PRIVATE KEY-----") and
              endswith("-----END PRIVATE KEY-----") and
              contains("\n"))
          ' credentials.json > /dev/null; then
            echo "::error::Google credentials JSON or private key is invalid. Check GOOGLE_CREDENTIALS and GOOGLE_PRIVATE_KEY."
            exit 1
          fi
          echo "Google service-account credentials structure and private-key format OK."

      - name: Run wnr-parkrun-league
        run: Rscript R/wnr-parkrun-league.R

      - name: Commit updated cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/wnr
          git diff --cached --quiet || git commit -m "Update wnr league cache"
          git push
