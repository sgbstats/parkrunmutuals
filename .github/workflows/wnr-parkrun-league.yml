name: wnr-parkrun-league

on:
  schedule:
    # 09:00 UTC every Saturday (GitHub cron is UTC; this is 09:00 UK time in GMT, 10:00 in BST)
    - cron: "0 9 * * 6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-league:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::tidyverse
            any::hms
            any::googlesheets4
            any::jsonlite
            sgbstats/parkrunfunctions

      - name: Run wnr-parkrun-league
        env:
          # Full service-account JSON; a separate private-key override is optional.
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
        run: Rscript R/wnr-parkrun-league.R

      - name: Commit updated cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/wnr
          git diff --cached --quiet || git commit -m "Update wnr league cache"
          git push
