name: wnr-parkrun-league

on:
  schedule:
    # 09:00 UTC every Saturday (GitHub cron is UTC; this is 09:00 UK time in GMT, 10:00 in BST)
    - cron: "0 9 * * 6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-league:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::tidyverse
            any::hms
            any::googlesheets4
            any::jsonlite
            any::httr
            sgbstats/parkrunfunctions

      - name: Run wnr-parkrun-league
        env:
          # Full service-account JSON; a separate private-key override is optional.
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://uapfyikxspmcifgdergl.supabase.co' }}
          SUPABASE_API_KEY: ${{ secrets.SUPABASE_API_KEY }}
          PARKRUNMUTUALS_SUPABASE_BUCKET: ${{ vars.PARKRUNMUTUALS_SUPABASE_BUCKET || 'prmutuals' }}
        run: Rscript R/wnr-parkrun-league.R
