name: wnr-parkrun-league

on:
  schedule:
    # 09:00 UTC every Saturday (GitHub cron is UTC; this is 09:00 UK time in GMT, 10:00 in BST)
    - cron: "0 9 * * 6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-league:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::tidyverse
            any::hms
            any::googlesheets4
            sgbstats/parkrunfunctions

      - name: Write Google credentials
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
        run: |
          jq --arg key "$GOOGLE_PRIVATE_KEY" '.private_key = $key' \
            <<< "$GOOGLE_CREDENTIALS" > credentials.json

      - name: Check credentials file
        run: |
          jq -e '.type == "service_account"' credentials.json > /dev/null && echo "type OK"
          jq -e '.private_key | startswith("-----BEGIN PRIVATE KEY-----")' credentials.json > /dev/null && echo "private_key header OK"
          jq -e '.private_key | contains("\\n")' credentials.json > /dev/null && echo "private_key contains literal backslash-n (bad)" || echo "no literal backslash-n"
          echo "private_key line count: $(jq -r '.private_key' credentials.json | wc -l)"

      - name: Run wnr-parkrun-league
        run: Rscript R/wnr-parkrun-league.R

      - name: Commit updated cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/wnr
          git diff --cached --quiet || git commit -m "Update wnr league cache"
          git push
